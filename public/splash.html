<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>CAROM</title>
    <link rel="modulepreload" href="splash.js">
    <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #121820;
      color: #f3ead6;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    main {
      box-sizing: border-box;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
    }
    .card {
      width: min(100%, 22rem);
      text-align: center;
    }
    .mark {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1rem;
      border: 2px solid #c9a15a;
      border-radius: 999px;
      display: grid;
      place-items: center;
      box-shadow:
        inset 0 0 0 7px #121820,
        inset 0 0 0 9px #c9a15a;
    }
    .dot {
      width: 1rem;
      height: 1rem;
      border-radius: 999px;
      background: #f6f0e2;
    }
    h1 {
      font-family: Palatino, 'Palatino Linotype', Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin: 0 0 0.35rem;
      font-size: 2rem;
    }
    .date {
      color: #c9a15a;
      font-size: 0.9rem;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0 0 1.25rem;
      line-height: 1.4;
      color: #d7c9a6;
    }
    button {
      appearance: none;
      border: 0;
      background: #c9a15a;
      color: #1a120c;
      font:
        600 1rem 'Segoe UI',
        sans-serif;
      padding: 0.7rem 1.6rem;
      border-radius: 999px;
      cursor: pointer;
    }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="mark" aria-hidden="true"><div class="dot"></div></div>
        <h1>CAROM</h1>
        <p class="date" id="date-label">Today's table</p>
        <p>Place one bumper. Bank the ball into the pocket.</p>
        <button id="start-btn" type="button">Play</button>
      </div>
    </main>
    <script src="splash.js" type="module"></script>
  </body>
</html>
